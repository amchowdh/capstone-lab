name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend tests with coverage
        run: npm run test:backend -- --coverage --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Append coverage summary
        run: |
          node -e 'const fs=require("fs");const p="packages/backend/coverage/coverage-summary.json";const c=JSON.parse(fs.readFileSync(p,"utf8")).total;const msg=`## Backend Coverage\n- Lines: ${c.lines.pct}%\n- Branches: ${c.branches.pct}%\n- Functions: ${c.functions.pct}%\n- Statements: ${c.statements.pct}%`;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,msg+"\n");'

      - name: Frontend tests
        run: npm run test:frontend
